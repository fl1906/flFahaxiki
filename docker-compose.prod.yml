version: '3.8'

services:
  sidao-chat:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/production.db
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./data:/app/db
      - ./production.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：生产数据库
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sidao_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    # 如果使用PostgreSQL，请取消注释并配置数据库连接

volumes:
  data:
  postgres_data: